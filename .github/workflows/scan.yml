name: Scansione Nasdaq
on:
  schedule:
    # 22:15 UTC, lun-ven: dopo la chiusura di Wall Street sia con l'ora solare
    # americana (chiude alle 21:00 UTC) sia con quella legale (chiude alle 20:00 UTC),
    # con un margine perche' Yahoo consolidi i prezzi di chiusura.
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

# evita due scansioni sovrapposte che si pesterebbero su data.json
concurrency:
  group: scansione-nasdaq
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Scansione
        run: python scanner.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Salva i dati
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica ai dati."
          else
            git commit -m "Aggiornamento dati"
            git pull --rebase
            git push
          fi
